<!DOCTYPE html>

<html>
  <head>
    <title>{% if page.title %}{{ page.title }} — Ujjwal Basumatary{% else %}Ujjwal Basumatary{% endif %}</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, user-scalable=no"
    />
    <meta
      name="description"
      content="Ujjwal Basumatary — physics student at IISc."
    />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/assets/css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/dreampulse/computer-modern-web-font@master/fonts.css"
    />
  </head>

  <body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-md navbar-light bg-light sticky-top">
      <div class="container">
        <a class="navbar-brand" href="{{ '/' | relative_url }}">Ujjwal Basumatary</a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            {% for item in site.data.menu %}
            <li
              class="nav-item{% if page.url == item.link %} active{% endif %}"
            >
              <a class="nav-link" href="{{ item.link | relative_url }}">
                {{ item.title }} {% if page.url == item.link %}
                <span class="visually-hidden">(current)</span>
                {% endif %}
              </a>
            </li>
            {% endfor %}
          </ul>
        </div>
      </div>
    </nav>

    <main class="flex-grow-1">{{ content }}</main>

    <footer>
      Ujjwal Basumatary &mdash; ujjwalb <em>dot</em> physics <em>at</em> gmail <em>dot</em> com
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script>
      // SPA-style nav: swap only <main> content, keep background alive
      (function () {
        function isLocalLink(a) {
          if (a.hostname !== location.hostname || a.hasAttribute("download")) return false;
          var href = a.getAttribute("href") || "";
          if (/\.(pdf|zip|png|jpg|jpeg|gif|svg)$/i.test(href)) return false;
          return true;
        }

        function updateNav(url) {
          var path = new URL(url, location.origin).pathname.replace(/\/$/, "") || "/";
          document.querySelectorAll(".nav-item").forEach(function (li) {
            var link = li.querySelector(".nav-link");
            if (!link) return;
            var href = link.getAttribute("href").replace(/\/$/, "") || "/";
            if (href === path) {
              li.classList.add("active");
            } else {
              li.classList.remove("active");
            }
          });
        }

        function loadPage(url, pushState) {
          fetch(url)
            .then(function (res) { return res.text(); })
            .then(function (html) {
              var parser = new DOMParser();
              var doc = parser.parseFromString(html, "text/html");
              var newMain = doc.querySelector("main");
              var newTitle = doc.querySelector("title");
              if (newMain) {
                document.querySelector("main").innerHTML = newMain.innerHTML;
              }
              if (newTitle) {
                document.title = newTitle.textContent;
              }
              updateNav(url);
              window.scrollTo({ top: 0, behavior: "smooth" });
              if (pushState) {
                history.pushState(null, "", url);
              }
              // Re-run any page-specific scripts (e.g. MathJax)
              if (window.MathJax && window.MathJax.typesetPromise) {
                window.MathJax.typesetPromise();
              }
            });
        }

        document.addEventListener("click", function (e) {
          var a = e.target.closest("a");
          if (!a || !isLocalLink(a)) return;
          if (e.ctrlKey || e.metaKey || e.shiftKey) return;
          e.preventDefault();
          if (a.href !== location.href) {
            loadPage(a.href, true);
          }
        });

        window.addEventListener("popstate", function () {
          loadPage(location.href, false);
        });
      })();
    </script>
  </body>
</html>
