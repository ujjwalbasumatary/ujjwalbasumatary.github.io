<!DOCTYPE html>

<html>
  <head>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, user-scalable=no"
    />
    <meta
      name="description"
      content="Ujjwal Basumatary — physics student at IISc."
    />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/assets/css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/dreampulse/computer-modern-web-font@master/fonts.css"
    />
  </head>

  <body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-md navbar-light bg-light sticky-top">
      <div class="container">
        <a class="navbar-brand" href="{{ '/' | relative_url }}">Ujjwal Basumatary</a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            {% for item in site.data.menu %}
            <li
              class="nav-item{% if page.url == item.link %} active{% endif %}"
            >
              <a class="nav-link" href="{{ item.link | relative_url }}">
                {{ item.title }} {% if page.url == item.link %}
                <span class="visually-hidden">(current)</span>
                {% endif %}
              </a>
            </li>
            {% endfor %}
          </ul>
          <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">&#9790;</button>
        </div>
      </div>
    </nav>

    <main class="flex-grow-1">{{ content }}</main>

    <footer>
      Ujjwal Basumatary &mdash; ujjwalb <em>dot</em> physics <em>at</em> gmail <em>dot</em> com
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script>
      (function () {
        var saved = localStorage.getItem("theme");
        var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        var theme = saved || "light";
        document.documentElement.setAttribute("data-theme", theme);

        var btn = document.getElementById("themeToggle");
        btn.textContent = theme === "dark" ? "\u2600" : "\u263E";

        btn.addEventListener("click", function () {
          var current = document.documentElement.getAttribute("data-theme");
          var next = current === "dark" ? "light" : "dark";
          document.documentElement.setAttribute("data-theme", next);
          localStorage.setItem("theme", next);
          btn.textContent = next === "dark" ? "\u2600" : "\u263E";
        });
      })();
    </script>
  </body>
</html>
