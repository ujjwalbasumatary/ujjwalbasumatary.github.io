  <head>

    <meta

    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"

    />
    <link rel="stylesheet" href="/assets/css/style.css" />

  <body class="d-flex flex-column min-vh-100">
    <canvas id="particles"></canvas>

    <nav class="navbar navbar-expand-md navbar-light bg-light sticky-top">
      <div class="container">
        <a class="navbar-brand" href="{{ '/' | relative_url }}">Ujjwal Basumatary</a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            {% for item in site.data.menu %}
            <li
              class="nav-item{% if page.url == item.link %} active{% endif %}"
            >
              <a class="nav-link" href="{{ item.link | relative_url }}">
                {{ item.title }} {% if page.url == item.link %}
                <span class="visually-hidden">(current)</span>
                {% endif %}
              </a>
            </li>
            {% endfor %}
          </ul>
          <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">&#9790;</button>
        </div>
      </div>
    </nav>

    <main class="flex-grow-1">{{ content }}</main>

    <footer>
      Ujjwal Basumatary &mdash; ujjwalb <em>dot</em> physics <em>at</em> gmail <em>dot</em> com
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script>
      (function () {
        var saved = localStorage.getItem("theme");
        var theme = saved || "light";
        document.documentElement.setAttribute("data-theme", theme);

        var btn = document.getElementById("themeToggle");
        btn.textContent = theme === "dark" ? "\u2600" : "\u263E";

        btn.addEventListener("click", function () {
          var current = document.documentElement.getAttribute("data-theme");
          var next = current === "dark" ? "light" : "dark";
          document.documentElement.setAttribute("data-theme", next);
          localStorage.setItem("theme", next);
          btn.textContent = next === "dark" ? "\u2600" : "\u263E";
        });
      })();
    </script>
    <script>
      (function () {
        var canvas = document.getElementById("particles");
        var ctx = canvas.getContext("2d");
        var w, h, particles, mouse = { x: -9999, y: -9999 };

        function getAccentColor() {
          var style = getComputedStyle(document.documentElement);
          return style.getPropertyValue("--accent").trim();
        }

        function hexToRgb(hex) {
          hex = hex.replace("#", "");
          if (hex.length === 3) hex = hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
          var r = parseInt(hex.substring(0, 2), 16);
          var g = parseInt(hex.substring(2, 4), 16);
          var b = parseInt(hex.substring(4, 6), 16);
          return r + ", " + g + ", " + b;
        }

        function init() {
          w = canvas.width = window.innerWidth;
          h = canvas.height = window.innerHeight;
          var count = Math.min(Math.floor((w * h) / 14000), 100);
          particles = [];
          for (var i = 0; i < count; i++) {
            particles.push({
              x: Math.random() * w,
              y: Math.random() * h,
              vx: (Math.random() - 0.5) * 0.35,
              vy: (Math.random() - 0.5) * 0.35,
              r: Math.random() * 2.5 + 1.5,
              alpha: Math.random() * 0.3 + 0.7
            });
          }
        }

        function animate() {
          ctx.clearRect(0, 0, w, h);
          var rgb = hexToRgb(getAccentColor());
          var lineAlpha = 0.45;
          var mouseAlpha = 0.55;
          var lineW = 1.2;
          var mouseW = 1.5;

          for (var i = 0; i < particles.length; i++) {
            var p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            if (p.x < 0) p.x = w;
            if (p.x > w) p.x = 0;
            if (p.y < 0) p.y = h;
            if (p.y > h) p.y = 0;

            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(" + rgb + ", " + p.alpha + ")";
            ctx.fill();

            for (var j = i + 1; j < particles.length; j++) {
              var p2 = particles[j];
              var dx = p.x - p2.x;
              var dy = p.y - p2.y;
              var dist = Math.sqrt(dx * dx + dy * dy);
              if (dist < 140) {
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.strokeStyle = "rgba(" + rgb + ", " + (lineAlpha * (1 - dist / 140)) + ")";
                ctx.lineWidth = lineW;
                ctx.stroke();
              }
            }

            var mdx = p.x - mouse.x;
            var mdy = p.y - mouse.y;
            var mDist = Math.sqrt(mdx * mdx + mdy * mdy);
            if (mDist < 180) {
              ctx.beginPath();
              ctx.moveTo(p.x, p.y);
              ctx.lineTo(mouse.x, mouse.y);
              ctx.strokeStyle = "rgba(" + rgb + ", " + (mouseAlpha * (1 - mDist / 180)) + ")";
              ctx.lineWidth = mouseW;
              ctx.stroke();
            }
          }
          requestAnimationFrame(animate);
        }

        var lastWidth = 0;
        init();
        animate();
        window.addEventListener("resize", function () {
          if (window.innerWidth !== lastWidth) {
            lastWidth = window.innerWidth;
            init();
          }
          // Ignore height-only changes (mobile address bar show/hide)
          // Setting canvas.height clears it, causing visible stutter
        });
        lastWidth = window.innerWidth;

        window.addEventListener("mousemove", function (e) {
          mouse.x = e.clientX;
          mouse.y = e.clientY;
        });
      })();
    </script>
    <script>
      // SPA-style nav: swap only <main> content, keep background alive
      (function () {
        function isLocalLink(a) {
          if (a.hostname !== location.hostname || a.hasAttribute("download")) return false;
          var href = a.getAttribute("href") || "";
          if (/\.(pdf|zip|png|jpg|jpeg|gif|svg)$/i.test(href)) return false;
          return true;
        }

        function updateNav(url) {
          var path = new URL(url, location.origin).pathname.replace(/\/$/, "") || "/";
          document.querySelectorAll(".nav-item").forEach(function (li) {
            var link = li.querySelector(".nav-link");
            if (!link) return;
            var href = link.getAttribute("href").replace(/\/$/, "") || "/";
            if (href === path) {
              li.classList.add("active");
            } else {
              li.classList.remove("active");
            }
          });
        }

        function loadPage(url, pushState) {
          fetch(url)
            .then(function (res) { return res.text(); })
            .then(function (html) {
              var parser = new DOMParser();
              var doc = parser.parseFromString(html, "text/html");
              var newMain = doc.querySelector("main");
              var newTitle = doc.querySelector("title");
              if (newMain) {
                document.querySelector("main").innerHTML = newMain.innerHTML;
              }
              if (newTitle) {
                document.title = newTitle.textContent;
              }
              updateNav(url);
              window.scrollTo({ top: 0, behavior: "smooth" });
              if (pushState) {
                history.pushState(null, "", url);
              }
              // Re-run any page-specific scripts (e.g. MathJax)
              if (window.MathJax && window.MathJax.typesetPromise) {
                window.MathJax.typesetPromise();
              }
            });
        }

        document.addEventListener("click", function (e) {
          var a = e.target.closest("a");
          if (!a || !isLocalLink(a)) return;
          if (e.ctrlKey || e.metaKey || e.shiftKey) return;
          e.preventDefault();
          if (a.href !== location.href) {
            loadPage(a.href, true);
          }
        });

        window.addEventListener("popstate", function () {
          loadPage(location.href, false);
        });
      })();
    </script>
  </body>
</html>
