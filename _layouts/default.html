<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>{% if page.title %}{{ page.title }} — Ujjwal Basumatary{% else %}Ujjwal Basumatary{% endif %}</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <meta
      name="description"
      content="{{ page.description | default: 'Ujjwal Basumatary, research assistant in the Department of Physics at IISc. Publications, research, and lecture notes in theoretical physics.' | escape }}"
    />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link rel="stylesheet" href="/assets/css/style.css" />
    <script src="/assets/js/navigation.js" defer></script>
  </head>

  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <nav class="navbar" aria-label="Main navigation">
      <div class="container">
        <a class="navbar-brand" href="{{ '/' | relative_url }}">Ujjwal Basumatary</a>

        <button
          class="navbar-toggler"
          type="button"
          hidden
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon" aria-hidden="true"></span>
        </button>

        <div class="navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            {% for item in site.data.menu %}
            <li
              class="nav-item{% if page.url == item.link %} active{% endif %}"
            >
              <a class="nav-link" href="{{ item.link | relative_url }}"{% if page.url == item.link %} aria-current="page"{% endif %}>
                {{ item.title }}
              </a>
            </li>
            {% endfor %}
          </ul>
        </div>
      </div>
    </nav>

    <main id="main-content" tabindex="-1">{{ content }}</main>

    {% unless page.contact_card %}
    <footer>
      <div>ujjwalb <em>dot</em> physics <em>at</em> gmail <em>dot</em> com</div>
    </footer>
    {% endunless %}

    <script
      data-goatcounter="https://ujjwal26.goatcounter.com/count"
      async
      src="https://gc.zgo.at/count.js"
    ></script>
  </body>
</html>
