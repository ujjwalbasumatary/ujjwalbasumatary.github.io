---
<!doctype html>

<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css"
        integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <link rel="stylesheet" href="/assets/css/style.css">
</head>

<style>
    .container {
        padding-top: 5vh;
        padding-bottom: 5vh;
    }

    /* Optional navbar customizations, keep commented or enable as desired */
    /* .navbar-custom {
        background-color: #fad4ff;
    }

    nav ul li:hover a {
        color: #d7c1dd;
    }

    nav ul li a {
        color: #802a98;
    } */
</style>

<body class="d-flex flex-column min-vh-100">

    <nav class="navbar-custom navbar navbar-expand-md navbar-light bg-light" style="font-size:25px">
        <button type="button" data-toggle="collapse" data-target="#navbarNav" class="navbar-toggler"
            aria-controls="navbarNav" aria-expanded="true" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                {% for item in site.data.menu %}
                <li class="nav-item"><a class="nav-link" href="{{ item.link }}">{{ item.title }}</a></li>
                {% endfor %}
            </ul>
        </div>
    </nav>

    <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js"
        integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"
        integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js"
        integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6"
        crossorigin="anonymous"></script>

    <main class="flex-grow-1">
        {{ content }}
    </main>

    <footer class="mt-auto text-center">
        <div id="result"></div>
        <div class="container">
            <div class="row mb-5">
                <div class="col-md-3 mb-5">
                    <script>
                        var date = document.lastModified;
                        document.getElementById("result").innerHTML = "Last updated: " + date;
                    </script>
                </div>
            </div>
        </div>
    </footer>

</body>

</html>
